name: E2E

# ---------------------------------------------------------------------------
# PROJETO EM PARQUE — execução manual apenas.
#
# O gatilho automático (push/PR) foi removido ao estacionar o projeto: um app parado
# não deve reimplantar a partir de commits não relacionados.
#
# ATENÇÃO: se o projeto do Cloudflare Pages ainda tiver integração com o GitHub,
# a própria Cloudflare compila a partir de `main` — este arquivo NÃO é o único
# caminho para um deploy. Ver docs/project/decommission-infra.md.
# ---------------------------------------------------------------------------
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Target URL (defaults to vite preview)'
        required: false
        default: ''

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Install agent-browser
        run: npm install -g agent-browser@0.27.0

      - name: Start vite preview
        run: npm run preview -- --port 4173 &
        working-directory: frontend

      - name: Run E2E
        env:
          E2E_SCREENSHOT_DIR: ${{ github.workspace }}/e2e-screenshots
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash scripts/e2e.sh "${{ inputs.url || 'http://localhost:4173' }}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: e2e-screenshots/
          retention-days: 7
